<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiganyHub — Key Gateway</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #05040a;
            --accent-red: #ff1e27;
            --accent-red-hover: #ff3b43;
            --accent-glow: rgba(255, 30, 39, 0.4);
            --card-bg: rgba(14, 12, 24, 0.85);
            --card-border: rgba(255, 30, 39, 0.25);
            --card-border-hover: rgba(255, 30, 39, 0.5);
            --text-main: #ffffff;
            --text-sub: #a1a1bb;
            --text-muted: #62627a;
            --success-green: #22c55e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 30, 39, 0.12) 0%, transparent 65%),
                radial-gradient(circle at 100% 100%, rgba(255, 30, 39, 0.05) 0%, transparent 50%),
                linear-gradient(to bottom, rgba(5, 4, 10, 0.8), #05040a);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            overflow-x: hidden;
            position: relative;
        }

        .ambient-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 30, 39, 0.15) 0%, transparent 70%);
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .header {
            text-align: center;
            margin-bottom: 6px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(14, 12, 24, 0.9);
            border: 1px solid var(--card-border);
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-sub);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 16px;
            box-shadow: 0 0 15px rgba(255, 30, 39, 0.1);
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-red);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-red);
        }

        .badge-dot.green {
            background-color: var(--success-green);
            box-shadow: 0 0 8px var(--success-green);
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 6px;
            text-shadow: 0 0 25px rgba(255, 30, 39, 0.4);
        }

        .title span {
            color: var(--accent-red);
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.5;
            font-weight: 400;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 30, 39, 0.05);
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: var(--card-border-hover);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title i {
            color: var(--accent-red);
        }

        .card-tag {
            font-family: 'Fira Code', monospace;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--accent-red);
            background: rgba(255, 30, 39, 0.1);
            border: 1px solid rgba(255, 30, 39, 0.3);
            padding: 3px 8px;
            border-radius: 6px;
        }

        .card-tag.done {
            color: var(--success-green);
            background: rgba(34, 197, 94, 0.1);
            border-color: rgba(34, 197, 94, 0.3);
        }

        .btn {
            width: 100%;
            height: 48px;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .btn-red {
            background: linear-gradient(135deg, #ff1e27 0%, #ba0c14 100%);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(255, 30, 39, 0.35);
            border: 1px solid rgba(255, 30, 39, 0.6);
        }

        .btn-red:hover {
            background: linear-gradient(135deg, #ff3b43 0%, #d6131c 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 30, 39, 0.55);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: rgba(255, 30, 39, 0.1);
            border-color: var(--accent-red);
            box-shadow: 0 0 15px rgba(255, 30, 39, 0.2);
        }

        .btn-discord {
            background: rgba(88, 101, 242, 0.15);
            border: 1px solid rgba(88, 101, 242, 0.4);
            color: #ffffff;
        }

        .btn-discord:hover {
            background: #5865F2;
            border-color: #5865F2;
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.4);
            transform: translateY(-2px);
        }

        .key-panel {
            display: none;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px dashed rgba(255, 30, 39, 0.3);
            animation: fadeIn 0.35s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .timer-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 12px;
        }

        .timer-label {
            font-size: 0.8rem;
            color: var(--text-sub);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .timer-label i {
            color: var(--success-green);
        }

        .timer-val {
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--success-green);
            letter-spacing: 0.06em;
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
        }

        .key-content-box {
            font-family: 'Fira Code', monospace;
            font-size: 0.78rem;
            color: #7dd3fc;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(125, 211, 252, 0.25);
            padding: 12px 14px;
            border-radius: 8px;
            word-break: break-all;
            margin-bottom: 12px;
            user-select: all;
            line-height: 1.45;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        .input-text {
            flex: 1;
            height: 44px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 0 14px;
            color: var(--text-main);
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-text:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 12px rgba(255, 30, 39, 0.25);
        }

        .btn-verify-action {
            width: 110px;
            height: 44px;
        }

        .response-box {
            font-size: 0.8rem;
            margin-top: 10px;
            padding: 10px 14px;
            border-radius: 8px;
            display: none;
            font-family: 'Fira Code', monospace;
        }

        .res-success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: var(--success-green);
        }

        .res-error {
            background: rgba(255, 30, 39, 0.1);
            border: 1px solid rgba(255, 30, 39, 0.3);
            color: #ff6b72;
        }

        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 6px;
            letter-spacing: 0.04em;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div id="statusBadge" class="badge">
                <span class="badge-dot"></span>
                <span id="badgeText">GATEWAY ACTIVE</span>
            </div>
            <h1 class="title">CIGANY<span>HUB</span></h1>
            <p id="subText" class="subtitle">Complete the required checkpoints to unlock your 8-hour access key.</p>
        </div>

        <!-- Main Card: Checkpoint / Key -->
        <div class="card">
            <div class="card-header">
                <span class="card-title"><i class="fa-solid fa-key"></i> Key Generation</span>
                <span id="stepTag" class="card-tag">CHECKPOINT (0/2)</span>
            </div>

            <button id="lootBtn" class="btn btn-red" onclick="startCheckpoint()">
                <i class="fa-solid fa-lock-open"></i> <span id="btnText">GET KEY - STEP 1 (0/2)</span>
            </button>

            <!-- Key Display Panel -->
            <div id="keyPanel" class="key-panel">
                <div class="timer-box">
                    <span class="timer-label"><i class="fa-solid fa-clock"></i> TIME REMAINING</span>
                    <span id="countdownTimer" class="timer-val">08:00:00</span>
                </div>

                <div id="keyText" class="key-content-box">...</div>

                <button id="copyBtn" class="btn btn-secondary" onclick="copyKey()">
                    <i class="fa-solid fa-copy"></i> <span id="copyText">COPY KEY TO CLIPBOARD</span>
                </button>
            </div>
        </div>

        <!-- Verify Card -->
        <div class="card">
            <div class="card-header">
                <span class="card-title"><i class="fa-solid fa-shield-halved"></i> Key Checker</span>
                <span class="card-tag">STATUS</span>
            </div>
            <div class="input-group">
                <input type="text" id="checkInput" class="input-text" placeholder="KEY_eyJ2IjoxLC..." />
                <button class="btn btn-secondary btn-verify-action" onclick="checkKey()">
                    VERIFY
                </button>
            </div>
            <div id="checkFeedback" class="response-box"></div>
        </div>

        <!-- Discord Card -->
        <div class="card">
            <div class="card-header">
                <span class="card-title"><i class="fa-brands fa-discord"></i> Community</span>
                <span class="card-tag">SUPPORT</span>
            </div>
            <a href="https://dsc.gg/ciganyhub" target="_blank" class="btn btn-discord">
                <i class="fa-brands fa-discord"></i> JOIN OFFICIAL DISCORD
            </a>
        </div>

        <div class="footer">
            CiganyHub &bull; Cryptographic 8-Hour Session Gating
        </div>
    </div>

    <script>
        let countdownInterval = null;
        let activeKey = "";
        let currentStep = 1;

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const claimed = params.get('claimed');
            const key = params.get('key');
            const exp = params.get('exp');
            const step = params.get('step');

            if (claimed === 'true' && key) {
                activeKey = key;
                document.getElementById('keyText').innerText = key;
                document.getElementById('keyPanel').style.display = 'block';
                document.getElementById('lootBtn').style.display = 'none';

                const dot = document.querySelector('.badge-dot');
                if (dot) dot.classList.add('green');
                document.getElementById('badgeText').innerText = 'KEY UNLOCKED (2/2)';
                
                const stepTag = document.getElementById('stepTag');
                stepTag.innerText = 'UNLOCKED (2/2)';
                stepTag.classList.add('done');

                document.getElementById('subText').innerText = 'All checkpoints complete! Your 8-hour access key is active.';

                const expiresAt = exp ? parseInt(exp, 10) : (Date.now() + 8 * 3600 * 1000);
                runTimer(expiresAt);
            } else if (step === '2') {
                currentStep = 2;
                document.getElementById('stepTag').innerText = 'CHECKPOINT (1/2)';
                document.getElementById('btnText').innerText = 'CONTINUE - STEP 2 (1/2)';
                document.getElementById('subText').innerText = 'Step 1 complete! Complete the final checkpoint to unlock your key.';
                document.getElementById('badgeText').innerText = 'STEP 1 OF 2 COMPLETED';
            } else {
                currentStep = 1;
                document.getElementById('stepTag').innerText = 'CHECKPOINT (0/2)';
                document.getElementById('btnText').innerText = 'GET KEY - STEP 1 (0/2)';
            }
        });

        async function startCheckpoint() {
            const btn = document.getElementById('lootBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> GENERATING LINK...';

            try {
                const res = await fetch(`/api/create-link?step=${currentStep}`, { method: 'POST' });
                const data = await res.json();

                if (data.success && data.adUrl) {
                    window.location.href = data.adUrl;
                } else {
                    alert('Unable to initialize verification link.');
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fa-solid fa-lock-open"></i> <span id="btnText">GET KEY - STEP ${currentStep} (${currentStep - 1}/2)</span>`;
                }
            } catch (err) {
                alert('Connection error: ' + err.message);
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-lock-open"></i> <span id="btnText">GET KEY - STEP ${currentStep} (${currentStep - 1}/2)</span>`;
            }
        }

        function runTimer(expiresAt) {
            if (countdownInterval) clearInterval(countdownInterval);

            function update() {
                const diff = expiresAt - Date.now();

                if (diff <= 0) {
                    clearInterval(countdownInterval);
                    document.getElementById('countdownTimer').innerText = '00:00:00';
                    document.getElementById('countdownTimer').style.color = '#ff1e27';
                    document.getElementById('keyText').innerText = 'Session expired. Please generate a new key.';
                    return;
                }

                const sec = Math.floor(diff / 1000);
                const h = String(Math.floor(sec / 3600)).padStart(2, '0');
                const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
                const s = String(sec % 60).padStart(2, '0');

                document.getElementById('countdownTimer').innerText = `${h}:${m}:${s}`;
            }

            update();
            countdownInterval = setInterval(update, 1000);
        }

        function copyKey() {
            if (!activeKey) return;
            navigator.clipboard.writeText(activeKey).then(() => {
                const textSpan = document.getElementById('copyText');
                textSpan.innerText = 'COPIED TO CLIPBOARD';
                setTimeout(() => {
                    textSpan.innerText = 'COPY KEY TO CLIPBOARD';
                }, 2000);
            });
        }

        async function checkKey() {
            const keyVal = document.getElementById('checkInput').value.trim();
            const feedback = document.getElementById('checkFeedback');

            if (!keyVal) {
                feedback.className = 'response-box res-error';
                feedback.innerText = 'Error: Please provide a key.';
                feedback.style.display = 'block';
                return;
            }

            feedback.className = 'response-box';
            feedback.innerText = 'Checking server...';
            feedback.style.display = 'block';

            try {
                const res = await fetch(`/api/verify?key=${encodeURIComponent(keyVal)}`);
                const data = await res.json();

                if (res.ok && data.valid) {
                    feedback.className = 'response-box res-success';
                    feedback.innerText = `Valid Key: ${data.formattedRemaining} remaining.`;
                } else {
                    feedback.className = 'response-box res-error';
                    feedback.innerText = data.message || 'Invalid or expired key.';
                }
            } catch (e) {
                feedback.className = 'response-box res-error';
                feedback.innerText = 'Failed to connect to verification API.';
            }
        }
    </script>
</body>
</html>
